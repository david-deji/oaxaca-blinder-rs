[package]
name = "oaxaca_blinder"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oaxaca_blinder"
description = "Oaxaca-Blinder decomposition on Polars DataFrames, with categorical drivers and bootstrapped standard errors."
readme = "README.md"
keywords = ["oaxaca-blinder", "econometrics", "statistics", "decomposition", "pay-equity"]
categories = ["science", "mathematics"]
# Tests, fixtures, benches and examples stay in the repository; the package carries only what builds.
include = ["/src", "/templates", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
name = "oaxaca_blinder"
crate-type = ["rlib", "cdylib"]

[dependencies]
getset = "0.1.2"
nalgebra = "0.32.3"
polars = { version = "0.44", default-features = false, features = ["lazy", "csv", "ndarray", "random", "dtype-date", "dtype-datetime", "dtype-time", "dtype-duration", "temporal"] }
comfy-table = { version = "7.0.1", optional = true }
rayon = "1.11.0"
ndarray = "0.15.6"
rand = "0.8.5"
rand_chacha = "0.3"
clarabel = "0.11.1"
clap = { version = "4.5.10", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
statrs = "0.18.0"
kdtree = "0.7"
askama = "0.14.0"

[features]
default = ["display"]
display = ["dep:comfy-table"]
# Native, dev/test-only memory-profiling harness (0014-MERIDIAN, In-Scope 11 /
# D1). Installs a tracking GlobalAlloc + checkpoint API behind this flag.
# OFF by default (INV-01): never enabled in the production/wasm build path.
mem-profile = []
# WASM threading cfg gate (0014-MERIDIAN, engine-parallel-surface D3). No deps —
# `rayon` stays UNCONDITIONAL (line 23) so native parallelism is byte-unchanged
# (INV-01). Enabling this only cfg-gates the wasm build; never in `default`.
wasm-threads = []
# Methods with no external oracle (0121-MERIDIAN L6): AKM worker and firm effects, DFL
# reweighting, JMP changes over time, nearest-neighbour and propensity-score matching. Results
# may change in any release. OFF by default; the CLI `--analysis-type akm|match` needs it too.
experimental = []

[dev-dependencies]
assert_cmd = "2.0"
predicates = "2.1"
# proptest: randomized property suite for the decomposition adding-up identities
# (0014-MERIDIAN statistical-trust-layer D-4). Dev-only — never a production dep.
proptest = "1"
# rayon: force a fixed-size thread pool in the memory-ceiling test (0014-MERIDIAN
# verification-benchmark D-3) so peak is measured at N_max_const=8 (worst-case in-band).
rayon = "1.11.0"
# sha2: the normalisation oracle test recomputes the sha256 of the R generator and of every
# fixture and refuses a golden that no longer matches them (0120-MERIDIAN).
sha2 = "0.10"

[[bin]]
name = "oaxaca-cli"
path = "src/main.rs"

# The memory-profile harness only compiles with the native-only, off-by-default
# `mem-profile` feature (INV-01) — so `cargo build --examples` under default
# features never touches it. `gen_mem_fixture` needs no feature and is
# auto-discovered.
[[example]]
name = "mem_profile_harness"
required-features = ["mem-profile"]

[dev-dependencies.criterion]
version = "0.5"

[[bench]]
name = "distance_bench"
harness = false
required-features = ["experimental"]

[package.metadata.docs.rs]
features = ["experimental"]
rustdoc-args = ["--cfg", "docsrs"]
