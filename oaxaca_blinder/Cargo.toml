[package]
name = "oaxaca_blinder"
version = "0.2.2"
authors = ["dot-comma-hyphen <poche450@gmail.com>"]
edition = "2021"

description = "A Rust library for performing Oaxaca-Blinder decomposition on Polars DataFrames, with support for categorical variables and bootstrapped standard errors. "
license = "MIT"
repository = "https://github.com/dot-comma-hyphen/oaxaca-blinder-rs"
readme = "README.md"
keywords = ["statistics", "economics", "oaxaca-blinder"]
categories = ["science"]

[lib]
name = "oaxaca_blinder"
crate-type = ["rlib", "cdylib"]

[dependencies]
getset = "0.1.2"
nalgebra = "0.32.3"
polars = { version = "0.44", default-features = false, features = ["lazy", "csv", "ndarray", "random", "dtype-date", "dtype-datetime", "dtype-time", "dtype-duration", "temporal"] }
comfy-table = { version = "7.0.1", optional = true }
rayon = "1.11.0"
ndarray = "0.15.6"
rand = "0.8.5"
rand_chacha = "0.3"
clarabel = "0.11.1"
clap = { version = "4.5.10", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
statrs = "0.18.0"
kdtree = "0.7"
askama = "0.14.0"

[features]
default = ["display"]
display = ["dep:comfy-table"]
# Native, dev/test-only memory-profiling harness (0014-MERIDIAN, In-Scope 11 /
# D1). Installs a tracking GlobalAlloc + checkpoint API behind this flag.
# OFF by default (INV-01): never enabled in the production/wasm build path.
mem-profile = []

[dev-dependencies]
assert_cmd = "2.0"
predicates = "2.1"

[[bin]]
name = "oaxaca-cli"
path = "src/main.rs"

# The memory-profile harness only compiles with the native-only, off-by-default
# `mem-profile` feature (INV-01) — so `cargo build --examples` under default
# features never touches it. `gen_mem_fixture` needs no feature and is
# auto-discovered.
[[example]]
name = "mem_profile_harness"
required-features = ["mem-profile"]

[dev-dependencies.criterion]
version = "0.5"

[[bench]]
name = "distance_bench"
harness = false
