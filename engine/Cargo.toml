[package]
name = "pay-equity-engine"
version = "0.1.0"
edition = "2021"
authors = ["OpenPay Team <contact@openpay.ai>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oaxaca_blinder = { path = "../oaxaca_blinder" }
# openpay_optimization = { version = "0.1.0", default-features = false, features = ["pay_equity"] }
polars = { version = "0.44", default-features = false, features = ["lazy", "csv", "serde", "diff", "dtype-categorical", "dtype-struct", "strings", "polars-ops", "polars-io"] }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
anyhow = "1.0"
getrandom = { version = "0.3", optional = true }
hashbrown = { version = "0.14", features = ["raw"] }
nalgebra = "0.32"
console_error_panic_hook = { version = "0.1", optional = true }
statrs = "0.18.0"
sha2 = "0.10"
gloo-net = { version = "0.6", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# Real rayon parallelism in the threaded WASM build (0014-MERIDIAN, toolchain-build D4 /
# engine-parallel-surface D2). Optional: pulled ONLY by the `wasm-threads` feature, never
# on the native/default graph (INV-01; AC-6 `cargo tree` shows it absent by default).
wasm-bindgen-rayon = { version = "1.3.0", optional = true }

[dependencies.web-sys]
version = "0.3"
features = ["console"]
optional = true

[features]
default = []
# Opt-in (off by default): compiles the partner offline-access module (engine/src/access.rs).
# TM/default builds keep this off — see engine/src/lib.rs gating comment.
partner-access = []
wasm = [
    "wasm-bindgen",
    "serde-wasm-bindgen",
    "console_error_panic_hook",
    "gloo-net",
    "wasm-bindgen-futures",
    "js-sys",
    "web-sys",
    "getrandom/wasm_js"
]
# Threaded WASM: real rayon parallelism via wasm-bindgen-rayon (0014-MERIDIAN). Superset of
# `wasm`; pulls the optional rayon-init dep + propagates the cfg gate into oaxaca_blinder.
# Never in `default` — the native graph never sees it (INV-01; AC-6 cargo-tree assertion).
wasm-threads = ["dep:wasm-bindgen-rayon", "wasm", "oaxaca_blinder/wasm-threads"]


[dev-dependencies]
wasm-bindgen-test = "0.3.42"
