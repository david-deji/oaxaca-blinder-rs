name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC — non-blocking perf-drift benchmark (benchmark-speedup job self-gates on this).
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates (Lint, Test, Fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # No toolchain override, no components list here: rust-toolchain.toml governs
        # the channel, the rustfmt + clippy components, and the wasm32 target.

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-stable"

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --all-features

  wasm-verify:
    name: WASM Build + Verify (dual-artifact, Strategy A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned nightly for the THREADED pass (build-std + atomics); stable (rust-toolchain.toml)
      # for the SEQUENTIAL pass. INV-01: native/seq stays on stable, only the threaded pass is nightly.
      - name: Setup pinned nightly (rust-src + wasm target)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-06-27
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Setup stable (reads rust-toolchain.toml for the sequential pass)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-wasm-threaded"
          # Caches ./target only. The threaded repro double-build below uses non-default
          # CARGO_TARGET_DIRs (target-repro-a / -b), which this action never restores, so both
          # repro builds recompile std from source under -Zbuild-std — no cache masking (W8).

      - name: Install prebuilt wasm-bindgen-cli (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.106

      - name: Build SEQUENTIAL artifact (stable, --target web)
        run: |
          mkdir -p wasm-out
          RUSTFLAGS="--remap-path-prefix $HOME/.cargo=/cargo --remap-path-prefix $PWD=/src --remap-path-prefix $HOME/.rustup=/rustup" \
            cargo build -p pay-equity-engine --features wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/pay_equity_engine.wasm wasm-out/seq.wasm
          # Smoke the binding step (output NOT hashed: wasm-bindgen output is not the hashed unit).
          wasm-bindgen wasm-out/seq.wasm \
            --out-dir engine/pkg --target web --remove-name-section --remove-producers-section

      - name: Build THREADED artifact (nightly, build-std, atomics, --target web)
        run: |
          RUSTFLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals \
            -C link-arg=--max-memory=342228992 -C link-arg=-zstack-size=1048576 \
            --remap-path-prefix $HOME/.cargo=/cargo --remap-path-prefix $PWD=/src \
            --remap-path-prefix $HOME/.rustup=/rustup" \
            cargo +nightly-2025-06-27 build -p pay-equity-engine \
              --features wasm-threads --target wasm32-unknown-unknown --release \
              -Zbuild-std=panic_abort,std --locked
          cp target/wasm32-unknown-unknown/release/pay_equity_engine.wasm wasm-out/threaded.wasm
          wasm-bindgen wasm-out/threaded.wasm \
            --out-dir engine/pkg-threaded --target web \
            --remove-name-section --remove-producers-section

      # Uploaded before any compare, so a hash mismatch still leaves the bytes to inspect (0119 S1).
      - name: Record raw WASM hashes
        if: ${{ !cancelled() }}
        run: |
          cd wasm-out
          sha256sum seq.wasm threaded.wasm | tee raw-sha256.txt
          rustc --version --verbose > toolchain-stable.txt
          rustc +nightly-2025-06-27 --version --verbose > toolchain-nightly.txt
          rustup component list --installed > components-stable.txt
          rustup component list --installed --toolchain nightly-2025-06-27 > components-nightly.txt

      - name: Upload raw WASM artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wasm-raw
          path: wasm-out/

      - name: Upload threaded WASM pkg artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg-threaded
          path: engine/pkg-threaded/

      - name: Compare SEQUENTIAL raw WASM to baseline
        if: ${{ !cancelled() }}
        run: |
          EXPECTED=$(cut -d' ' -f1 engine/pay_equity_engine.wasm.sha256)
          ACTUAL=$(sha256sum wasm-out/seq.wasm | cut -d' ' -f1)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Sequential raw WASM sha256 mismatch! Expected $EXPECTED Actual $ACTUAL"
            echo "If intentional, run scripts/build-wasm.sh --record and commit engine/pay_equity_engine.wasm.sha256."
            exit 1
          fi
          echo "Sequential raw WASM sha256 verified: $ACTUAL"

      - name: Compare THREADED raw WASM to baseline
        if: ${{ !cancelled() }}
        run: |
          EXPECTED=$(cut -d' ' -f1 engine/pay_equity_engine.threaded.wasm.sha256)
          ACTUAL=$(sha256sum wasm-out/threaded.wasm | cut -d' ' -f1)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Threaded raw WASM sha256 mismatch! Expected $EXPECTED Actual $ACTUAL"
            echo "If intentional, run scripts/build-wasm.sh --record and commit"
            echo "engine/pay_equity_engine.threaded.wasm.sha256."
            exit 1
          fi
          echo "Threaded raw WASM sha256 verified: $ACTUAL"

      - name: Threaded reproducibility double-build (two non-default target dirs — no cache masking, W8)
        if: ${{ !cancelled() }}
        run: |
          FLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals \
            -C link-arg=--max-memory=342228992 -C link-arg=-zstack-size=1048576 \
            --remap-path-prefix $HOME/.cargo=/cargo --remap-path-prefix $PWD=/src \
            --remap-path-prefix $HOME/.rustup=/rustup"
          RUSTFLAGS="$FLAGS" CARGO_TARGET_DIR=target-repro-a \
            cargo +nightly-2025-06-27 build -p pay-equity-engine \
              --features wasm-threads --target wasm32-unknown-unknown --release \
              -Zbuild-std=panic_abort,std --locked
          RUSTFLAGS="$FLAGS" CARGO_TARGET_DIR=target-repro-b \
            cargo +nightly-2025-06-27 build -p pay-equity-engine \
              --features wasm-threads --target wasm32-unknown-unknown --release \
              -Zbuild-std=panic_abort,std --locked
          A=$(sha256sum target-repro-a/wasm32-unknown-unknown/release/pay_equity_engine.wasm | cut -d' ' -f1)
          B=$(sha256sum target-repro-b/wasm32-unknown-unknown/release/pay_equity_engine.wasm | cut -d' ' -f1)
          if [ "$A" != "$B" ]; then
            echo "build-std threaded output not byte-reproducible across fresh recompiles: $A vs $B"; exit 1
          fi
          echo "Threaded double-build reproducibility verified: $A"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # cargo tree (ignore validator) resolves the workspace under the toolchain rust-toolchain.toml pins.
      - name: Setup Rust toolchain (1.90.0, matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4aab473fa1157d90c6dc14f879ca54797e16fea0 # 1.90.0
        with:
          toolchain: 1.90.0

      # Prebuilt binary, exact version. Building cargo-audit from source needs a newer rustc than the
      # pinned 1.90.0, which is why rustsec/audit-check audited nothing from the day the toolchain was pinned.
      - name: Install cargo-audit (pinned prebuilt)
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit --deny warnings
        run: cargo audit --deny warnings

      # Every ignore in .cargo/audit.toml must be dated, unexpired, matched to a locked package, and
      # classified (lock-only with an empty cargo tree, or risk-accepted with a reason).
      - name: Validate .cargo/audit.toml ignores
        if: ${{ !cancelled() }}
        run: python3 scripts/validate-audit-ignores.py --no-fetch

  memory-ceiling:
    name: Memory Ceiling (50k @ N=8 < 326 MiB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-stable"

      # The tracking allocator + peak metric are behind `mem-profile` (native-only, off by default).
      # `--all-features` in the quality job does NOT isolate this crate-scoped feature, so the ceiling
      # gets its own job. Fails if peak live bytes at 50k / N_max_const=8 reach the --max-memory budget.
      - name: Memory-ceiling test (tracking allocator)
        run: cargo test -p oaxaca_blinder --features mem-profile --test memory_ceiling_test -- --nocapture

  browser-parity:
    name: Browser Byte-Parity (COI, threaded WASM, seq/t2/t4)
    needs: [wasm-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup stable for native baseline build
      - name: Setup stable (reads rust-toolchain.toml for the native baseline build)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-wasm-threaded"

      - name: Download threaded WASM pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg-threaded
          path: engine/pkg-threaded/

      # D3 (0014-close round-1) / INV-02 cross-platform leg: native decompose_inner() baseline for the
      # SAME fixture/request/seed the threaded-WASM run above uses, so parity.spec.mjs can diff native
      # vs wasm(threads=1) at a per-numeric-field <=1e-6 tolerance. Native (host-target) build, so this
      # runs on stable, not the pinned wasm nightly.
      - name: Generate native baseline JSON (D3, INV-02 native<->wasm leg)
        run: cargo run -p pay-equity-engine --example native_baseline > verification/browser-parity/native-baseline.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('verification/browser-parity/package-lock.json') }}

      - name: Install Playwright + Chromium
        working-directory: verification/browser-parity
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser byte-parity (COI + nested worker spawn)
        working-directory: verification/browser-parity
        env:
          CI: "1"
        run: npx playwright test

  benchmark-speedup:
    name: Benchmark (Rust methods, non-blocking)
    # Perf-trend job, not a gate: schedule/dispatch only, and never fails the run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-stable"

      - name: Rust method benchmark (release, median, serial)
        run: cargo run -p oaxaca_blinder --release --example bench_methods
